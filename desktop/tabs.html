<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<title>Dev Deck</title>
<style>
  :root { --bg: #15171a; --panel: #1e2125; --line: #30353b; --text: #eceef0; --muted: #9aa2ab; --accent: #f2a33a; }
  html, body { height: 100%; margin: 0; overflow: hidden; }
  body { background: var(--bg); font: 11px system-ui, sans-serif; -webkit-app-region: drag; user-select: none; }
  nav { display: flex; align-items: flex-end; gap: 2px; height: 100%; box-sizing: border-box; padding: 0 12px 0 84px; border-bottom: 1px solid var(--line); }
  .tab { -webkit-app-region: no-drag; display: flex; align-items: center; flex: 0 1 180px; min-width: 56px; height: 30px; box-sizing: border-box; border: 1px solid var(--line); border-bottom: 0; border-radius: 4px 4px 0 0; }
  .tab.fixed { flex: 0 0 auto; }
  .tab.active { background: var(--panel); border-color: var(--accent); }
  button { border: 0; background: none; color: var(--muted); font: inherit; cursor: pointer; }
  .name { flex: 1; min-width: 0; height: 100%; padding: 0 12px; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; text-transform: uppercase; letter-spacing: 1.5px; }
  .tab:hover .name, .tab.active .name { color: var(--text); }
  .tab.active .name { font-weight: 600; }
  .close, .dark { flex: none; width: 20px; height: 20px; margin-right: 4px; border-radius: 3px; font-size: 13px; line-height: 1; }
  .close:hover, .dark:hover { background: var(--line); color: var(--text); }
  .dark { margin-right: 0; }
  .dark[aria-pressed=true] { color: var(--accent); }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
</style>
</head>
<body>
<nav role="tablist" id="tabs"></nav>
<script>
// The left gap only exists to clear the macOS window buttons.
if (window.tabs.platform !== 'darwin') document.getElementById('tabs').style.paddingLeft = '12px';

const el = (tag, props = {}, ...children) => {
  const node = Object.assign(document.createElement(tag), props);
  node.append(...children);
  return node;
};

function renderTab(tab, activeId) {
  const active = tab.id === activeId;
  const name = el('button', { className: 'name', textContent: tab.label, title: tab.label });
  name.setAttribute('role', 'tab');
  name.setAttribute('aria-selected', active);
  name.dataset.tab = tab.id;
  name.onclick = () => window.tabs.select(tab.id);
  const node = el('div', { className: `tab${active ? ' active' : ''}${tab.closable ? '' : ' fixed'}` }, name);
  if (tab.closable) {
    const dark = el('button', { className: 'dark', textContent: '◐', title: 'Dark mode for this tab' });
    dark.setAttribute('aria-label', `Dark mode for ${tab.label}`);
    dark.setAttribute('aria-pressed', tab.dark);
    dark.onclick = () => window.tabs.toggleDark(tab.id);
    const close = el('button', { className: 'close', textContent: '×' });
    close.setAttribute('aria-label', `Close ${tab.label}`);
    close.onclick = () => window.tabs.close(tab.id);
    node.append(dark, close);
  }
  return node;
}

window.tabs.onChange(({ tabs, active }) => {
  document.getElementById('tabs').replaceChildren(...tabs.map(tab => renderTab(tab, active)));
});
</script>
</body>
</html>
